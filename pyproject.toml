[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-sentinel"
version = "0.1.0"
description = "Módulo de análisis estático defensivo de calidad y propuestas de parches Zero Trust para Antigravity"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Team" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
